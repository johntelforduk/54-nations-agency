<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Contact Us</h2>
                
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <form id="contactForm" method="POST" action="https://formspree.io/f/mojkyzdb">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <input type="text" name="name" class="form-control" placeholder="Your Name *" required>
                            </div>
                            <div class="form-group">
                                <input type="email" name="email" class="form-control" placeholder="Your Email *" required>
                            </div>
                            <div class="form-group">
                                <input type="tel" name="phone" class="form-control" placeholder="Your Phone *" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <textarea name="message" class="form-control" placeholder="Your Message *" required></textarea>
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <div id="success" style="display:none;" class="alert alert-success mt-3">
                                Thank you! Your message has been sent.
                            </div>
                            <div id="error" style="display:none;" class="alert alert-danger mt-3">
                                Oops! Something went wrong, please try again.
                            </div>
                            <button type="submit" class="btn btn-xl">Send Message</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const success = document.getElementById('success');
        const error = document.getElementById('error');

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // prevent default form submission
            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    success.style.display = 'block';
                    error.style.display = 'none';
                    form.reset();
                } else {
                    throw new Error('Network response was not ok.');
                }
            } catch (err) {
                success.style.display = 'none';
                error.style.display = 'block';
            }
        });
    </script>
</section>
